name: Build and Package ADBTools

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本号 (例如: 1.8.30)'
        required: false
      release:
        description: '是否创建 Release'
        required: false
        type: boolean
        default: true

env:
  PYTHON_VERSION: '3.13'  # PyQt6 需要 Python >= 3.9，与本地开发环境保持一致
  APP_NAME: ADBTools

jobs:
  build-windows:
    name: Build Windows Executable
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        # fetch full history so tags and git metadata are available when needed
        # (prevents issues when relying on tags or setuptools_scm)

    - name: Check admin.manifest 清单文件
      run: |
        if (Test-Path "admin.manifest") {
          Write-Host "✅ admin.manifest 存在"
          # 输出内容排查BOM/中文乱码问题
          Get-Content "admin.manifest" -Raw
        } else {
          Write-Host "❌ 缺失 admin.manifest，打包会失败"
          exit 1
        }  

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        
    - name: Set UTF-8 encoding for Python output
      run: |
        echo "PYTHONIOENCODING=utf-8" >> $env:GITHUB_ENV
        [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
        
    - name: Cache pip dependencies
      uses: actions/cache@v4
      with:
        path: ~\AppData\Local\pip\Cache
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
          
    - name: Install system dependencies
      run: |
        choco install visualstudio2022buildtools --package-parameters "--add Microsoft.VisualStudio.Workload.VCTools" --no-progress
        choco install mingw --no-progress
        # 改用全局持久PATH，所有步骤（Python/Shell）都能读取
        echo "C:\tools\mingw64\bin" >> $env:GITHUB_PATH
        # 验证gcc是否可用，提前打印日志
        gcc --version
        
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements_nuitka.txt
        
    - name: Verify Nuitka installation
      run: |
        python -m nuitka --version
        
    - name: Get version from input or config
      id: get_version
      shell: python
      env:
        INPUT_VERSION: ${{ github.event.inputs.version }}
      run: |
        import os, json
        version = (os.environ.get('INPUT_VERSION') or '').strip()
        if not version:
            # try to read version from adbtools_config.json
            try:
                with open('adbtools_config.json', 'r', encoding='utf-8') as f:
                    cfg = json.load(f)
                v = cfg.get('version')
                if isinstance(v, dict):
                    major = v.get('major', 0)
                    minor = v.get('minor', 0)
                    patch = v.get('patch', 0)
                    build = v.get('build')
                    version = f"{major}.{minor}.{patch}" + (f".{build}" if build is not None else "")
                else:
                    version = str(v) if v is not None else ''
            except Exception as e:
                print('Warning: failed to read adbtools_config.json:', e)
                version = ''
        if not version:
            # fallback
            version = '1.0.0'
        # write output
        with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
            out.write(f"version={version}\n")
        print('Using version:', version)
        
    - name: Update version in config
      shell: python
      run: |
        import json
        from pathlib import Path
        version = "${{ steps.get_version.outputs.version }}"
        config_file = Path("adbtools_config.json")
        if config_file.exists():
            try:
                with open(config_file, 'r', encoding='utf-8') as f:
                    config = json.load(f)
                # 如果原来是对象则按字段更新，避免把对象替换成字符串
                parts = version.split('.')
                if isinstance(config.get('version'), dict):
                    cfgver = config['version']
                    cfgver['major'] = int(parts[0]) if len(parts) > 0 and parts[0].isdigit() else cfgver.get('major', 0)
                    cfgver['minor'] = int(parts[1]) if len(parts) > 1 and parts[1].isdigit() else cfgver.get('minor', 0)
                    cfgver['patch'] = int(parts[2]) if len(parts) > 2 and parts[2].isdigit() else cfgver.get('patch', 0)
                    if len(parts) > 3 and parts[3].isdigit():
                        cfgver['build'] = int(parts[3])
                    config['version'] = cfgver
                else:
                    # 原来不是对象则直接写字符串
                    config['version'] = version
                # 保持 file_version 为字符串（便于展示）
                config['file_version'] = version
                with open(config_file, 'w', encoding='utf-8') as f:
                    json.dump(config, f, indent=2, ensure_ascii=False)
                print(f"Updated version to: {version}")
            except Exception as e:
                print('Failed to update config:', e)
        else:
            print('Config file not found, skipping version update')

    - name: Update version in .iss file
      run: |
        # 从 config_manager 获取版本号并更新 .iss 文件
        $version = "${{ steps.get_version.outputs.version }}"
        $issFile = "ADBTools_setup.iss"
        
        if (Test-Path $issFile) {
            $content = Get-Content $issFile -Raw
            $content = $content -replace '#define MyAppVersion "[^"]+"', "#define MyAppVersion `"$version`""
            Set-Content -Path $issFile -Value $content -NoNewline
            Write-Host "Updated .iss version to: $version"
        } else {
            Write-Host "Warning: ADBTools_setup.iss not found"
        }

    - name: Write version into source files (config_manager.py & config_manager_enhanced.py)
      env:
        VERSION: ${{ steps.get_version.outputs.version }}
      shell: python
      run: |
        import os, re
        version = os.environ.get('VERSION', '1.0.0')
        parts = version.split('.')
        def to_int(i):
            try:
                return int(i)
            except:
                return 0
        major = to_int(parts[0]) if len(parts)>0 else 1
        minor = to_int(parts[1]) if len(parts)>1 else 0
        patch = to_int(parts[2]) if len(parts)>2 else 0
        build = to_int(parts[3]) if len(parts)>3 else 0

        def replace_version_block(text):
            new_block = (
                '"version": {\n'
                f'            "major": {major},\n'
                f'            "minor": {minor},\n'
                f'            "patch": {patch},\n'
                f'            "build": {build},\n'
                '        }'
            )
            # replace the first occurrence of "version": { ... }
            return re.sub(r'"version"\s*:\s*\{.*?\}', new_block, text, count=1, flags=re.S)

        files = ['config_manager.py', 'config_manager_enhanced.py']
        for fp in files:
            if os.path.exists(fp):
                with open(fp, 'r', encoding='utf-8') as f:
                    txt = f.read()
                new_txt = replace_version_block(txt)
                if new_txt != txt:
                    with open(fp, 'w', encoding='utf-8') as f:
                        f.write(new_txt)
                    print(f'Updated version in {fp} to {version}')
                else:
                    print(f'No version block replaced in {fp} (pattern not found)')
            else:
                print(f'{fp} not found, skipping')

    - name: Commit updated version files
      if: false  # 新增，临时关闭
      shell: bash
      env:
        VERSION: ${{ steps.get_version.outputs.version }}
      run: |
        set -e
        git config user.name "GitHub Actions"
        git config user.email "actions@github.com"
        git add config_manager.py config_manager_enhanced.py adbtools_config.json ADBTools_setup.iss || true
        if git diff --staged --quiet; then
          echo "No changes to commit"
        else
          git commit -m "ci: update version to v${VERSION} in source/config files"
          git push origin HEAD:${{ github.ref_name }}
        fi

    - name: Force-update tag to point to latest commit
      if: always()
      continue-on-error: true  # tag 创建失败不阻塞构建，Release 步骤会兜底
      shell: bash
      env:
        VERSION: ${{ steps.get_version.outputs.version }}
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        set -e
        TAG_NAME="v${VERSION}"
        # 用 GitHub API 创建/更新 tag（只需 contents 权限）。
        # 不用 git push：GITHUB_TOKEN 推送指向含工作流文件修改的提交时会被拒绝
        # （permissions 块无 workflows 键，该限制无法通过声明权限绕过）。
        if gh api "repos/${GITHUB_REPOSITORY}/git/refs/tags/${TAG_NAME}" \
             -X PATCH -f sha="${GITHUB_SHA}" >/dev/null 2>&1; then
          echo "✅ tag ${TAG_NAME} 已更新指向 ${GITHUB_SHA}"
        else
          gh api "repos/${GITHUB_REPOSITORY}/git/refs" \
             -f ref="refs/tags/${TAG_NAME}" -f sha="${GITHUB_SHA}" >/dev/null
          echo "✅ tag ${TAG_NAME} 已创建指向 ${GITHUB_SHA}"
        fi

    - name: Download platform-tools
      run: |
        # 下载 Android platform-tools
        $url = "https://dl.google.com/android/repository/platform-tools-latest-windows.zip"
        $output = "platform-tools.zip"
        
        Write-Host "Downloading platform-tools..."
        Invoke-WebRequest -Uri $url -OutFile $output
        
        Write-Host "Extracting platform-tools..."
        Expand-Archive -Path $output -DestinationPath "." -Force
        
        Remove-Item $output
        Write-Host "platform-tools downloaded successfully"
        
    - name: Copy platform-tools to build directory
      run: |
        # 复制 platform-tools 到项目根目录（Nuitka 构建时会使用）
        $platformToolsSrc = "platform-tools"
        $projectRoot = "."
        
        $adbFiles = @("adb.exe", "AdbWinApi.dll", "AdbWinUsbApi.dll", "aapt.exe", "fastboot.exe")
        
        foreach ($file in $adbFiles) {
            $src = Join-Path $platformToolsSrc $file
            $dst = Join-Path $projectRoot $file
            
            if (Test-Path $src) {
                Copy-Item $src $dst -Force
                Write-Host "Copied: $file"
            } else {
                Write-Host "Warning: $file not found in platform-tools"
            }
        }
        
    - name: Build with Nuitka (OneFile)
      run: |
        $env:Path = "C:\tools\mingw64\bin;" + $env:Path
        gcc --version
        python nuitka_build_fixed_v2.py --build onefile
        Write-Host "==== build_nuitka 全部文件 ===="
        Get-ChildItem -Recurse build_nuitka -ErrorAction SilentlyContinue
        Write-Host "==== dist_nuitka 全部文件 ===="
        Get-ChildItem -Recurse dist_nuitka -ErrorAction SilentlyContinue
        
    - name: Verify build output
      run: |
        Write-Host "Checking build output..."
        
        if (Test-Path "dist_nuitka\\ADBTools_nuitka.exe") {
            Write-Host "✅ Build successful!"
            Get-Item "dist_nuitka\\ADBTools_nuitka.exe" | Select-Object Name, Length, LastWriteTime
        } else {
            Write-Host "❌ Build failed - executable not found"
            exit 1
        }
        
    - name: Install Inno Setup
      run: |
        # GitHub Actions Windows runner 已经预装了 Inno Setup v6.7.1
        # 只需添加到 PATH 即可使用
        $innoPath = "C:\Program Files (x86)\Inno Setup 6"
        if (Test-Path $innoPath) {
            echo "$innoPath" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
            Write-Host "Using pre-installed Inno Setup v6.7.1"
        } else {
            # 如果预装版本不存在，尝试使用 Chocolatey 安装最新版本
            choco install innosetup -y --no-progress
            echo "$innoPath" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
            Write-Host "Inno Setup installed via Chocolatey"
        }
        
    - name: Build installer with Inno Setup
      run: |
        # 使用 Inno Setup 编译安装包
        $isccPath = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
        
        if (Test-Path $isccPath) {
            Write-Host "Building installer with Inno Setup..."
            & $isccPath "ADBTools_setup.iss"
            
            if ($LASTEXITCODE -eq 0) {
                Write-Host "✅ Installer built successfully!"
                
                # 列出生成的安装包
                if (Test-Path "Output\\ADBTools_Setup.exe") {
                    Get-Item "Output\\ADBTools_Setup.exe" | Select-Object Name, Length, LastWriteTime
                }
            } else {
                Write-Host "❌ Inno Setup compilation failed"
                exit 1
            }
        } else {
            Write-Host "Error: ISCC.exe not found at $isccPath"
            exit 1
        }
        
    - name: Create release package
      run: |
        # 创建发布包目录
        $releaseDir = "release_package"
        New-Item -ItemType Directory -Force -Path $releaseDir | Out-Null
        
        # 复制可执行文件和必要资源
        Copy-Item "dist_nuitka\*" "$releaseDir\" -Recurse -Force
        
        # 复制配置文件
        Copy-Item "adbtools_config.json" "$releaseDir\" -Force
        Copy-Item "adbtool.ui" "$releaseDir\" -Force
        Copy-Item "file_manager_ui.ui" "$releaseDir\" -Force
        
        # 压缩为 ZIP
        Compress-Archive -Path "$releaseDir\*" -DestinationPath "ADBTools_${{ steps.get_version.outputs.version }}_Windows.zip" -Force
        
        Write-Host "Release package created: ADBTools_${{ steps.get_version.outputs.version }}_Windows.zip"
        
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ADBTools-${{ steps.get_version.outputs.version }}
        path: |
          ADBTools_${{ steps.get_version.outputs.version }}_Windows.zip
          Output/ADBTools_Setup.exe
        retention-days: 90
        
    - name: Create GitHub Release
      if: github.event.inputs.release == 'true'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v${{ steps.get_version.outputs.version }}
        files: |
          ADBTools_${{ steps.get_version.outputs.version }}_Windows.zip
          Output/ADBTools_Setup.exe
        name: ADBTools v${{ steps.get_version.outputs.version }}
        body: |
          ## ADBTools v${{ steps.get_version.outputs.version }}
          
          ### 更新内容
          - 更新UI框架版本为PyQt6
          - 优化文件管理器性能和界面
          
          ### 下载
          - [便携版 ZIP](https://github.com/${{ github.repository }}/releases/download/v${{ steps.get_version.outputs.version }}/ADBTools_${{ steps.get_version.outputs.version }}_Windows.zip)
          - [安装版 EXE](https://github.com/${{ github.repository }}/releases/download/v${{ steps.get_version.outputs.version }}/ADBTools_Setup.exe)
          
          ### 系统要求
          - Windows 10/11
          - .NET Framework 4.5+
          
          ### 使用说明
          **便携版**：
          1. 下载并解压 ZIP 文件
          2. 运行 ADBTools_nuitka.exe
          3. 连接 Android 设备
          4. 开始使用
          
          **安装版**：
          1. 下载 ADBTools_Setup.exe
          2. 双击运行安装程序
          3. 按提示完成安装
          4. 从开始菜单或桌面快捷方式启动
        draft: false
        prerelease: false
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Sync Release & Tag to Gitee
      if: github.event.inputs.release == 'true'
      env:
        GITEE_TOKEN: ${{ secrets.GITEE_ACCESS_TOKEN }}
        GITEE_USER: ${{ secrets.GITEE_OWNER }}
        GITEE_REPO: ${{ secrets.GITEE_REPO }}
        VERSION: ${{ steps.get_version.outputs.version }}
        TAG_NAME: v${{ steps.get_version.outputs.version }}
      shell: pwsh
      run: |
        $tag = $env:TAG_NAME
        $version = $env:VERSION
        $releaseName = "ADBTools $tag"

        # 0. 本地创建tag（"Force-update tag"步骤通过GitHub API在远程创建tag，
        #    本地checkout不会同步该tag，需手动指向当前提交）
        git tag -f $tag $env:GITHUB_SHA

        # 1. 推送Tag到Gitee仓库
        $giteeUrl = "https://$($env:GITEE_USER):$($env:GITEE_TOKEN)@gitee.com/$($env:GITEE_USER)/$($env:GITEE_REPO).git"
        git remote remove gitee 2>$null
        git remote add gitee $giteeUrl
        git push gitee $tag --force
        if ($LASTEXITCODE -ne 0) {
            Write-Error "推送Tag到Gitee失败，中止后续步骤"
            exit 1
        }
        git remote remove gitee

        # 2. Release正文（用数组拼接避免 PowerShell here-string 顶格破坏 YAML 缩进结构）
        $body = @(
          "## ADBTools v$version",
          "",
          "### 更新内容",
          "- 增加输入法切换功能",
          "- 增加微软语音测试功能",
          "",
          "### 下载",
          "- [便携版 ZIP](https://gitee.com/$($env:GITEE_USER)/$($env:GITEE_REPO)/releases/download/$tag/ADBTools_${version}_Windows.zip)",
          "- [安装版 EXE](https://gitee.com/$($env:GITEE_USER)/$($env:GITEE_REPO)/releases/download/$tag/ADBTools_Setup.exe)",
          "",
          "### 系统要求",
          "- Windows 10/11",
          "- .NET Framework 4.5+",
          "",
          "### 使用说明",
          "**便携版**：",
          "1. 下载并解压 ZIP 文件",
          "2. 运行 ADBTools_nuitka.exe",
          "3. 连接 Android 设备",
          "4. 开始使用",
          "",
          "**安装版**：",
          "1. 下载 ADBTools_Setup.exe",
          "2. 双击运行安装程序",
          "3. 按提示完成安装",
          "4. 从开始菜单或桌面快捷方式启动"
        ) -join "`n"

        # 3. 创建Gitee Release（Token放在Header，不拼接URL）
        $releasePayload = @{
          tag_name   = $tag
          name       = $releaseName
          body       = $body
          target_commitish = $env:GITHUB_SHA
          draft      = $false
          prerelease = $false
        }
        $header = @{
          "Content-Type"  = "application/json"
          "Authorization" = "token $($env:GITEE_TOKEN)"
        }
        $createUrl = "https://gitee.com/api/v5/repos/$($env:GITEE_USER)/$($env:GITEE_REPO)/releases"
        $resp = Invoke-RestMethod -Uri $createUrl -Method Post -Body ($releasePayload | ConvertTo-Json) -Headers $header
        $releaseId = $resp.id
        Write-Host "✅ Gitee Release 创建成功，ReleaseID: $releaseId"

        # 4. 上传二进制附件函数
        function Upload-GiteeAsset {
          param(
            [string]$filePath,
            [string]$releaseId,
            [string]$token,
            [string]$owner,
            [string]$repo
          )
          if (-not (Test-Path $filePath)) {
            Write-Warning "文件不存在：$filePath"
            return
          }
          $uploadHeader = @{
            "Authorization" = "token $token"
          }
          # Gitee 上传附件端点是 attach_files（不是 GitHub 的 assets）
          $uploadUrl = "https://gitee.com/api/v5/repos/$owner/$repo/releases/$releaseId/attach_files"
          try {
            Invoke-RestMethod -Uri $uploadUrl -Method Post -Form @{ file = Get-Item -Path $filePath } -Headers $uploadHeader
            Write-Host "✅ 已上传：$filePath"
          } catch {
            Write-Error "上传附件失败：$filePath - $($_.Exception.Message)"
            throw
          }
        }

        # 上传两个打包产物
        Upload-GiteeAsset -filePath "ADBTools_${version}_Windows.zip" -releaseId $releaseId -token $env:GITEE_TOKEN -owner $env:GITEE_USER -repo $env:GITEE_REPO
        Upload-GiteeAsset -filePath "Output/ADBTools_Setup.exe" -releaseId $releaseId -token $env:GITEE_TOKEN -owner $env:GITEE_USER -repo $env:GITEE_REPO
    # ==========同步模块结束==========

    - name: Send notification (optional)
      if: always()
      env:
        SERVERCHAN_API_KEY: ${{ secrets.SERVERCHAN_API_KEY }}
      run: |
        if ($env:SERVERCHAN_API_KEY) {
          $status = if ($LASTEXITCODE -eq 0) { "成功" } else { "失败" }
          $title = "ADBTools 构建${status}"
          $content = "版本: ${{ steps.get_version.outputs.version }}`n分支: ${{ github.ref_name }}`n提交: ${{ github.sha }}"
          
          $body = @{
            title = $title
            desp = $content
          } | ConvertTo-Json
          
          try {
            Invoke-RestMethod -Uri "https://sctapi.ftqq.com/$env:SERVERCHAN_API_KEY.send" -Method Post -Body $body -ContentType "application/json"
            Write-Host "Notification sent"
          } catch {
            Write-Host "Failed to send notification: $_"
          }
        } else {
          Write-Host "SERVERCHAN_API_KEY not set, skipping notification"
        }
