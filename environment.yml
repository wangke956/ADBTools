# ADBTools conda 环境配置（已迁移至 PyQt6）
# 使用方法: conda env create -f environment.yml
name: adbtools
channels:
  - defaults
dependencies:
  - python=3.13
  - pip
  - pip:
      # ========== PyQt6 相关 ==========
      - PyQt6>=6.5.0
      - qdarkstyle>=3.2.0
      # pyqtdarktheme 已停更（仅支持 Python <3.12），移除，代码有 Fusion 回退
      - PyQt6-Fluent-Widgets>=1.5.0
      - qtmodern>=0.2.0
      # ========== ADB 和设备管理 ==========
      - uiautomator2>=3.2.0
      - adbutils>=2.8.0
      # ========== 数据处理 ==========
      - openpyxl>=3.1.0
      - psutil>=5.9.0
      - lxml>=4.9.0
      # ========== 日期时间（时区支持） ==========
      - pytz>=2023.3
      # ========== 打包工具 ==========
      - nuitka>=1.8.0
      # ========== 网络相关 ==========
      - requests>=2.28.0
